server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy → noc-api container
    location /api/ {
        proxy_pass         http://noc-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Static assets — revalidate via ETag (no immutable, allows version bumps to land)
    location ~* \.(css|js|woff2|svg|png|ico)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        etag on;
    }

    # index.html — never cache so new asset versions load immediately
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Mock data — never cache (dev convenience)
    location /mock-data/ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
