server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos con cache corto (mock cambia seguido en dev)
    location ~* \.(css|js|woff2|svg|png|ico)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # JSON del mock — sin cache
    location /mock-data/ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deshabilitar acceso a . files
    location ~ /\. {
        deny all;
    }
}
