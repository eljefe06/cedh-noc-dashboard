services:

  noc-frontend:
    image: nginx:alpine
    container_name: noc-frontend
    restart: unless-stopped
    ports:
      - "100.104.244.83:8080:80"   # solo Tailscale — no expuesto en IP pública
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - noc-net
    depends_on:
      noc-api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  noc-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noc-api
    restart: unless-stopped
    user: "0"   # root — needed to read the SSH key mounted from /root/.ssh; V1 behind Tailscale
    env_file: .env
    volumes:
      - noc-data:/data
      # Mock data — seeded into SQLite cache on startup (overwritten by real collectors)
      - ./frontend/mock-data:/app/frontend/mock-data:ro
      # SSH key for connecting to the 4 VPS — must exist on VPS-MyRock before deploy
      - /root/.ssh/noc_collector_ed25519:/root/.ssh/noc_collector_ed25519:ro
    networks:
      - noc-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  noc-data:
    name: noc-data

networks:
  noc-net:
    name: noc-net
    driver: bridge
